name: Run tests

#триггер
on: [ push, workflow_dispatch ]

jobs:
  run-tests:
    name: Set up(review apps) and run tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          
      - name: Install Docker on macOS
        run: |
          # Устанавливаем Docker Desktop для macOS
          brew install --cask docker
          
          # Запускаем Docker Desktop (может потребовать ручного подтверждения)
          open -a Docker
          
          # Ждем пока Docker запустится
          echo "Waiting for Docker to start..."
          sleep 60
          
          # Проверяем установку
          docker --version


      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up services
        run: cd infrastructure/docker-compose/ && bash restart-docker.sh && cd ../..


      - name: Run tests
        run: ./mvnw clean test -q