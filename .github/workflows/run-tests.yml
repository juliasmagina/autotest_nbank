name: Run tests

#триггер
on: [ push, workflow_dispatch ]

jobs:
  run-tests:
    name: Set up(review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin    

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up services
        run: cd infrastructure/docker-compose/ && bash restart-docker.sh && cd ../..

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend to be ready..."

          # Даем больше времени на запуск Spring Boot
          sleep 30

          # Пробуем разные эндпоинты health check
          for i in {1..30}; do
            if curl -f http://localhost:4111/health 2>/dev/null; then
              echo "Health check passed!"
              break
            elif curl -f http://localhost:4111/actuator/health 2>/dev/null; then
              echo "Actuator health check passed!"
              break
            elif curl -f http://localhost:4111/ 2>/dev/null; then
              echo "Root endpoint responded!"
              break
            else
              echo "Attempt $i/30 - application not ready, waiting 10 seconds..."
              sleep 10
            fi
          done

          # Если все еще не готово, покажем логи для диагностики
          cd infrastructure/docker-compose/
          docker-compose logs backend --tail=50
          cd ../..

      - name: Run tests
        run: ./mvnw clean test -q