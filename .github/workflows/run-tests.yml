name: Run tests

#триггер
on: [ push, workflow_dispatch ]

jobs:
  run-tests:
    name: Set up(review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'


      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up services
        run: cd infrastructure/docker-compose && bash restart-docker.sh && cd ../..

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be fully ready..."
          
          # Даем время на запуск контейнеров
          sleep 45
          
          # Ждем пока бэкенд станет доступен
          echo "Checking backend availability..."
          for i in {1..20}; do
            if curl -f -s http://localhost:4111/health > /dev/null; then
              echo "✅ Backend health check passed!"
              break
            elif curl -f -s http://localhost:4111/actuator/health > /dev/null; then
              echo "✅ Actuator health check passed!"
              break
            elif curl -s http://localhost:4111/ > /dev/null; then
              echo "✅ Backend is responding!"
              break
            else
              echo "Attempt $i/20 - Backend not ready yet..."
              if [ $i -eq 20 ]; then
                echo "❌ Backend failed to start"
                # Покажем логи для диагностики (используем новый синтаксис)
                cd infrastructure/docker-compose
                docker compose logs backend
                cd ../..
                exit 1
              fi
              sleep 10
            fi
          done
          
          echo "🎉 Backend is ready for tests!"

      - name: Run tests
        run: ./mvnw clean test -q
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend