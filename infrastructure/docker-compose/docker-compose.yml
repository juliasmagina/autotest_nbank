services:
  backend:
    image: nobugsme/nbank:with_fraud_check
    platform: linux/arm64
    ports:
      - "4111:4111"
    networks:
      - nbank-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - FRAUD_DETECTION_SERVICE_URL=http://wiremock:8080
    depends_on:
      - postgres
      - wiremock

  frontend:
    image: nobugsme/nbank-ui:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nbank-network

  selenoid:
    image: aerokube/selenoid:latest
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/:/etc/selenoid/:ro
    command: [ "container-network", "nbank-network" ]
    depends_on:
      - frontend
    networks:
      - nbank-network

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    ports:
      - "6567:8080"
    command: [ "--selenoid-uri", "http://selenoid:4444" ]
    depends_on:
      - selenoid
    networks:
      - nbank-network

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=nbank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nbank-network

  wiremock:
    image: wiremock/wiremock:latest
    ports:
      - "8080:8080"
    command: [ "--verbose" ]
    networks:
      - nbank-network

networks:
  nbank-network:
    name: nbank-network

volumes:
  postgres_data:
